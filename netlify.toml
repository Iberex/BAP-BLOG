# Netlify hosts only the TinaCMS editor (the public blog stays on GitHub Pages).
# The team logs in at /admin/. Secrets are set in the Netlify dashboard, see README.
[build]
  command = "npm run build:editor"
  publish = "dist"
  # The free plan allows about 20 deploys a month, and the editor reads posts live
  # from its database. So skip the build when a commit only changes content
  # (every save in TinaCMS or Pages CMS is a commit). Exit code 0 = skip.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)src/content' ':(exclude)src/data' ':(exclude)public/beelden' ':(exclude)public/bestanden' ':(exclude)content'"

[build.environment]
  NODE_VERSION = "22"
  TINA_EDITOR = "1"

[functions]
  # Bundle everything into one small file: leaving next-auth outside pulled in all of Next.js
  # and made the upload too large.
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/tina/*"
  to = "/.netlify/functions/tina"
  status = 200
  force = true

[[redirects]]
  from = "/api/cloudinary/*"
  to = "/.netlify/functions/tina"
  status = 200
  force = true
