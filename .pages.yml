media:
  input: public
  output: /BAP-BLOG
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      fields: [ title, author, pubDatetime, draft ]
      primary: title
      sort: [ pubDatetime ]
      order: desc
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - name: pubDatetime
        label: Datum
        type: date
        required: true
        options: { time: true, format: "yyyy-MM-dd'T'HH:mm:ssXXX" }
      - name: author
        label: Auteur
        type: select
        required: true
        options: { values: [ Ibe, Tjorven, Senne ] }
      - name: tags
        label: "Tags (minstens één pijler + één soort)"
        type: select
        required: true
        options:
          multiple: true
          values: [ UX, DESIGN, DEV, ALGEMEEN, dagboek, research, proces, feedback, learning, ai, planning ]
      - { name: description, label: "Korte samenvatting (1 zin)", type: string, required: true }
      - { name: featured, label: "Uitgelicht op home", type: boolean, default: false }
      - { name: draft, label: "Concept (nog niet publiceren)", type: boolean, default: false }
      - { name: body, label: Tekst, type: rich-text }
  - name: planning
    label: Planning
    type: file
    path: src/pages/planning.md
    fields:
      - { name: layout, type: string, hidden: true, default: "../layouts/AboutLayout.astro" }
      - { name: nav, type: string, hidden: true, default: planning }
      - { name: title, label: Titel, type: string }
      - { name: body, label: "Inhoud (tabel in Markdown)", type: text }
  - name: uren
    label: Uren
    type: file
    path: src/pages/uren.md
    fields:
      - { name: layout, type: string, hidden: true, default: "../layouts/AboutLayout.astro" }
      - { name: nav, type: string, hidden: true, default: uren }
      - { name: title, label: Titel, type: string }
      - { name: body, label: "Inhoud (tabel in Markdown: voeg onderaan een rij toe per dag)", type: text }
  - name: team
    label: Team
    type: file
    path: src/pages/team.md
    fields:
      - { name: layout, type: string, hidden: true, default: "../layouts/AboutLayout.astro" }
      - { name: nav, type: string, hidden: true, default: team }
      - { name: title, label: Titel, type: string }
      - { name: body, label: "Inhoud (tabel in Markdown)", type: text }
  - name: about
    label: Over deze blog
    type: file
    path: src/pages/about.md
    fields:
      - { name: layout, type: string, hidden: true, default: "../layouts/AboutLayout.astro" }
      - { name: title, label: Titel, type: string }
      - { name: body, label: Inhoud, type: text }
