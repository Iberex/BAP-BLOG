media:
  input: public
  output: /BAP-BLOG
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      fields: [ title, author, pubDatetime, draft ]
      primary: title
      sort: [ pubDatetime ]
      order: desc
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - name: author
        label: Wie schrijft?
        type: select
        required: true
        options: { values: [ Ibe, Tjorven, Senne ] }
      - name: pijler
        label: Pijler
        type: select
        required: true
        options: { values: [ UX, DESIGN, DEV, ALGEMEEN ] }
      - name: soort
        label: Soort post
        type: select
        required: true
        options: { values: [ dagboek, research, proces, feedback, learning, ai, planning ] }
      - { name: body, label: Tekst, type: rich-text }
      - name: pubDatetime
        label: Datum (staat al op vandaag)
        type: date
        required: true
        options: { time: true, format: "yyyy-MM-dd'T'HH:mm:ssXXX" }
      - { name: draft, label: "Nog niet publiceren", type: boolean, default: false }
  - name: uren
    label: Uren
    type: file
    path: src/data/uren.json
    format: json
    list: true
    fields:
      - { name: datum, label: Datum, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: ibe, label: "Uren Ibe", type: number, default: 0, options: { min: 0, max: 24, step: 0.5 } }
      - { name: tjorven, label: "Uren Tjorven", type: number, default: 0, options: { min: 0, max: 24, step: 0.5 } }
      - { name: senne, label: "Uren Senne", type: number, default: 0, options: { min: 0, max: 24, step: 0.5 } }
      - { name: wat, label: "Wat deden we?", type: string }
  - name: planning
    label: Planning
    type: file
    path: src/data/planning.json
    format: json
    list: true
    fields:
      - { name: datum, label: "Datum (vrije tekst, bv. 'vr 20/11' of '9/11 – 13/11')", type: string, required: true }
      - { name: wat, label: Wat, type: string, required: true }
  - name: team
    label: Team
    type: file
    path: src/data/team.json
    format: json
    list: true
    fields:
      - { name: naam, label: Naam, type: string, required: true }
      - { name: rol, label: "Rol(len)", type: string }
      - name: pijler
        label: Pijler
        type: select
        options: { values: [ UX, DESIGN, DEV, ALGEMEEN ] }
  - name: about
    label: Over deze blog
    type: file
    path: src/pages/about.md
    fields:
      - { name: layout, type: string, hidden: true, default: "../layouts/AboutLayout.astro" }
      - { name: title, label: Titel, type: string }
      - { name: body, label: Inhoud, type: rich-text, options: { input: public/assets, output: /BAP-BLOG/assets } }
